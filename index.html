<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>potato vibes</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="ui-overlay">
            <div id="score-display">
                <div class="score-item">
                    <span class="label">Distance:</span>
                    <span id="distance">0m</span>
                </div>
                <div class="score-item">
                    <span class="label">Highscore:</span>
                    <span id="highscore">0m</span>
                </div>
            </div>
            <div id="game-message"></div>
        </div>
    </div>

    <div id="landscape-warning" class="hidden">
        <div class="warning-content">
            <h1>Please Rotate Your Device</h1>
            <p>This game is best experienced in landscape mode.</p>
            <div class="phone-icon">📱</div>
        </div>
    </div>

    <!-- Load game modules -->
    <script src="parallax.js"></script>
    <script src="sprites.js"></script>
    <script src="powerbar.js"></script>
    <script src="angleIndicator.js"></script>
    <script src="physics.js"></script>
    <script src="scoring.js"></script>
    <script src="ui.js"></script>
    <script src="input.js"></script>
    <script src="game.js"></script>
</body>

</html>
